<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="255" viewBox="0 0 1200 255" role="img" aria-labelledby="title desc"><title id="title">ОТ ИСХОДНИКА К РЕЗУЛЬТАТУ</title><desc id="desc">Видимый диапазон управляет представлением. Он становится участком анализа только по явной команде.</desc><rect width="1200" height="255" rx="20" fill="#081626"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="45" fill="#b9c9d9" font-size="16" letter-spacing="2">ОТ ИСХОДНИКА К РЕЗУЛЬТАТУ</text><rect x="28" y="82" width="211" height="102" rx="14" fill="#13273c" stroke="#29445f"/><text x="46" y="110" fill="#50d7ee" font-size="13">01</text><text x="46" y="140" fill="#f2f7fc" font-size="18" font-weight="600">Запись</text><text x="46" y="165" fill="#b9c9d9" font-size="12">LVM · TXT · CSV</text><path d="M243 132h14m-5-5 5 5-5 5" fill="none" stroke="#50d7ee" stroke-width="2"/><rect x="263" y="82" width="211" height="102" rx="14" fill="#13273c" stroke="#29445f"/><text x="281" y="110" fill="#50d7ee" font-size="13">02</text><text x="281" y="140" fill="#f2f7fc" font-size="18" font-weight="600">Обработка</text><text x="281" y="165" fill="#b9c9d9" font-size="12">Формулы → фильтр</text><path d="M478 132h14m-5-5 5 5-5 5" fill="none" stroke="#50d7ee" stroke-width="2"/><rect x="498" y="82" width="211" height="102" rx="14" fill="#13273c" stroke="#29445f"/><text x="516" y="110" fill="#50d7ee" font-size="13">03</text><text x="516" y="140" fill="#f2f7fc" font-size="18" font-weight="600">Вход анализа</text><text x="516" y="165" fill="#b9c9d9" font-size="12">Вся запись / участок</text><path d="M713 132h14m-5-5 5 5-5 5" fill="none" stroke="#50d7ee" stroke-width="2"/><rect x="733" y="82" width="211" height="102" rx="14" fill="#13273c" stroke="#29445f"/><text x="751" y="110" fill="#50d7ee" font-size="13">04</text><text x="751" y="140" fill="#f2f7fc" font-size="18" font-weight="600">FFT / FRF</text><text x="751" y="165" fill="#b9c9d9" font-size="12">Численный результат</text><path d="M948 132h14m-5-5 5 5-5 5" fill="none" stroke="#50d7ee" stroke-width="2"/><rect x="968" y="82" width="211" height="102" rx="14" fill="#13273c" stroke="#29445f"/><text x="986" y="110" fill="#50d7ee" font-size="13">05</text><text x="986" y="140" fill="#f2f7fc" font-size="18" font-weight="600">Сохранение</text><text x="986" y="165" fill="#b9c9d9" font-size="12">AMSig · CSV · PNG</text><text x="28" y="224" fill="#b9c9d9" font-size="14">Видимый диапазон управляет представлением. Он становится участком анализа только по явной команде.</text></g></svg>
