name: Bug report
description: Report a reproducible problem / Сообщить о воспроизводимой ошибке
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary / Кратко
      description: What is broken?
      placeholder: Describe the bug and the expected behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Как повторить
      description: Provide a minimal sequence that reproduces the issue.
      placeholder: |
        1. Open ...
        2. Switch to ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / Окружение
      placeholder: "AMSignal version / версия; Windows version / версия Windows; build method if applicable / способ сборки"
    validations:
      required: true
  - type: textarea
    id: analysis
    attributes:
      label: Recording and analysis / Запись и анализ
      description: "For FFT/FRF or large-file issues / Для ошибок FFT, АЧХ и больших файлов"
      placeholder: "Format and size; channels; interval; filter/formula; FRF roles and L; Auto/Manual budget / Формат, размер, каналы, участок, обработка, роли АЧХ и L, бюджет памяти"
  - type: textarea
    id: notes
    attributes:
      label: Extra notes / Дополнительно
      description: "Screenshots, logs and a small non-sensitive sample / Скриншоты, журналы и небольшой пример без конфиденциальных данных"
